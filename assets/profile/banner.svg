<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Olá, mundo! — Yuri Siqueira Alves</title>
  <desc id="desc">Banner em azul com uma janela de terminal exibindo informações de Yuri sobre desenvolvimento de software e cibersegurança.</desc>

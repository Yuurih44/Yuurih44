      <stop offset="1" stop-color="#3569b5"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2438"/>
      <stop offset="1" stop-color="#071927"/>
